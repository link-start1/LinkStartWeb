<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linkstart</title>
   <link rel="stylesheet" href="css/open.css">
   
  
</head>
<body>
    <div class="video-container">
        <!-- Background video -->
        <video autoplay muted>
            <source src="video/Sword Art Online  Link Start.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Button initially hidden -->
        <button id="delayedButton"><a href="open.html">linkstart</a></button>
    </div>

    <script>
        // Show button after 4 seconds
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('delayedButton').classList.add('show');
            }, 4000);
        });
    </script>
</body>
</html>




</body>
</html>
